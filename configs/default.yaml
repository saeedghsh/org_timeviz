app:
  output_dir: outputs
  log_level: INFO

org_sources:
  mode: emacs
  emacs_init_paths:
    - "~/.emacs"
    - "~/.emacs.d/init.el"
    - "~/.emacs.d/lisp/init-org.el"
  emacs_agenda_var: org-agenda-files
  explicit_files: []

reports:
  filters:
    include_tags: []
    exclude_tags: []
    tag_match_mode: any
    include_task_regex: []
    exclude_task_regex: []
  plots:
    # If null, timeseries spans the full data range.
    timeseries_last_n_days: null

    calendar_view_by_time_bucket:
      # Exact, case-sensitive task titles rendered at 50% opacity in this calendar only.
      low_opacity_task_titles:
        - after lunch walk
        - procrastination
        - unwell

time_buckets:
  other_bucket: other
  bucket_order:
    - pride
    - alfa_laval
    - tooling
    - ml_tooling_tutorial
    - aim_flix
    - msc
    - keeper
    - hh
    - holidays_vacations
    - sick_leave
    - other

  tag_to_bucket:
    pride: pride
    alfa_laval: alfa_laval
    tooling: tooling
    ml_tooling_tutorial: ml_tooling_tutorial
    aim_flix: aim_flix
    msc: msc
    keeper: keeper
    hh: hh
    ite: hh
    isdd: hh
    sick_leave: sick_leave
    holidays: holidays_vacations
    vacations: holidays_vacations

  resolution:
    default_strategy: priority
    priority_order:
      - pride
      - alfa_laval
      - tooling
      - ml_tooling_tutorial
      - aim_flix
      - msc
      - keeper
      - hh
      - holidays_vacations
      - sick_leave
      - other

    # Used only for split_weighted. Leaving this empty means equal split.
    weights: {}

    # First matching rule wins.
    rules: []
