[project]
name = "org-timeviz"
version = "0.1.0"
description = "Generate time-tracking plots from Org-mode CLOCK entries (Org files are the source of truth)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "plotly>=6.0",
]

[project.scripts]
org-timeviz = "org_timeviz.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.19",
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "ruff>=0.16",
  "ty>=0.0.97",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["org_timeviz*"]

[tool.setuptools.package-data]
"org_timeviz.org_source" = ["elisp/*.el"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# `--cov` measures the `source` below and fails under `fail_under`.
addopts = "-v -ra --strict-markers --cov --cov-report=term-missing"
python_files = ["test_*.py"]

[tool.coverage.run]
branch = true
source = ["org_timeviz"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.coverage.html]
directory = "output/htmlcov"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["outputs"]

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F",  # Ruff's defaults: pycodestyle errors and Pyflakes
  "B",    # flake8-bugbear: likely bugs
  "C4",   # flake8-comprehensions
  "G",    # flake8-logging-format: lazy logging arguments
  "I",    # isort
  "PIE",  # flake8-pie: redundant code
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
]
ignore = [
  # Collapsing the last of several parallel guard clauses into
  # `return not (...)` reads worse than the guards it replaces.
  "SIM103",
]
# The calendar hover text shows time ranges with a typographic en dash.
allowed-confusables = ["–"]

[tool.ruff.lint.isort]
known-first-party = ["org_timeviz"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.src]
exclude = ["extras", "temp"]  # local folders, as for mypy below

[tool.ty.terminal]
# Warnings, such as an unused `ty: ignore` comment, fail the check too.
error-on-warning = true

[tool.mypy]
exclude = '^extras/|^temp/' # local folders I want to skip type checking
explicit_package_bases = true
# Tests import their shared helpers as the top-level module `conftest`.
mypy_path = "tests"
strict = true

[[tool.mypy.overrides]]
# Plotly ships neither inline types nor stubs.
module = ["plotly", "plotly.*"]
ignore_missing_imports = true
