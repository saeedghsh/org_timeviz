[project]
name = "org-timeviz"
version = "0.1.0"
description = "Generate time-tracking plots from Org-mode CLOCK entries (Org files are the source of truth)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "plotly>=6.0",
]

[project.scripts]
org-timeviz = "org_timeviz.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.19",
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "ruff>=0.16",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["org_timeviz*"]

[tool.setuptools.package-data]
"org_timeviz.org_source" = ["elisp/*.el"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=org_timeviz --cov-report=term-missing"
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]


[tool.coverage.run]
branch = true
source = ["org_timeviz"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["outputs"]

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F",  # Ruff's defaults: pycodestyle errors and Pyflakes
  "B",    # flake8-bugbear: likely bugs
  "C4",   # flake8-comprehensions
  "G",    # flake8-logging-format: lazy logging arguments
  "I",    # isort
  "PIE",  # flake8-pie: redundant code
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
]
ignore = [
  # Collapsing the last of several parallel guard clauses into
  # `return not (...)` reads worse than the guards it replaces.
  "SIM103",
]
# The calendar hover text shows time ranges with a typographic en dash.
allowed-confusables = ["–"]

[tool.ruff.lint.isort]
known-first-party = ["org_timeviz"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
exclude = '^extras/|^temp/' # local folders I want to skip type checking
ignore_missing_imports = true
explicit_package_bases = true
strict = true
warn_unused_ignores = false # Disable warnings for unused "type: ignore"
warn_return_any = true
disable_error_code = [
    "type-arg", # Missing type parameters for generic type 'ndarray'
]
show_error_codes = true