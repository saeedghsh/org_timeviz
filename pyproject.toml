[project]
name = "org-timeviz"
version = "0.1.0"
description = "Generate time-tracking plots from Org-mode CLOCK entries (Org files are the source of truth)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "plotly>=6.0",
]

[project.scripts]
org-timeviz = "org_timeviz.cli:main"

[tool.setuptools.package-data]
"org_timeviz.org_source" = ["elisp/*.el"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=org_timeviz --cov-report=term-missing"
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]


[tool.coverage.run]
branch = true
source = ["org_timeviz"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["outputs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["org_timeviz"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
exclude = '^extras/|^temp/' # local folders I want to skip type checking
ignore_missing_imports = true
explicit_package_bases = true
strict = true
warn_unused_ignores = false # Disable warnings for unused "type: ignore"
warn_return_any = true
disable_error_code = [
    "type-arg", # Missing type parameters for generic type 'ndarray'
]
show_error_codes = true